name: Package

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            library: libresvg_jni.so
          - os: windows-latest
            name: windows
            library: resvg_jni.dll
    env:
      # libjpeg-turbo 3.0.1 declares a CMake minimum older than 3.5.
      # CMake 4 refuses that unless this floor is set. Linking stays static.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          command -v nasm
          nasm -v

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: NASM is on PATH
        shell: bash
        run: command -v nasm && nasm -v

      - name: Ensure CMake and a C compiler
        shell: bash
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y cmake build-essential
            else
              echo "CMake is missing on the Windows runner"
              exit 1
            fi
          fi
          command -v cmake
          cmake --version
          if [ "$RUNNER_OS" = "Linux" ] && ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            command -v gcc
          fi

      - name: Test default JPEG is 4:2:0
        working-directory: rust
        run: cargo test --locked --lib -- jpeg_default_is_420 transparent_pixels half_red custom_background

      - name: Build release library
        working-directory: rust
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: rust/target/release/${{ matrix.library }}
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/lib

      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: src/main/resources/lib

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Package jar
        run: mvn -B -ntp package

      - name: Check both native libraries are inside the jar
        run: |
          jar=$(echo target/*.jar)
          jar tf "$jar" | tee jar-contents.txt
          grep -qx 'lib/libresvg_jni.so' jar-contents.txt
          grep -qx 'lib/resvg_jni.dll' jar-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: resvg-jni-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/lib/libresvg_jni.so src/main/resources/lib/resvg_jni.dll
          if git diff --cached --quiet; then
            echo "native libraries unchanged"
            exit 0
          fi
          git commit -m "Update native libraries"
          git push
