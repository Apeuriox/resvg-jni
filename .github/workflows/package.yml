name: Package

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            library: libresvg_jni.so
          - os: windows-latest
            name: windows
            library: resvg_jni.dll
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release library
        working-directory: rust
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: rust/target/release/${{ matrix.library }}
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: src/main/resources/lib

      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: src/main/resources/lib

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Package jar
        run: mvn -B -ntp package

      - name: Check both native libraries are inside the jar
        run: |
          jar=$(echo target/*.jar)
          jar tf "$jar" | tee jar-contents.txt
          grep -qx 'lib/libresvg_jni.so' jar-contents.txt
          grep -qx 'lib/resvg_jni.dll' jar-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: resvg-jni-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/lib/libresvg_jni.so src/main/resources/lib/resvg_jni.dll
          if git diff --cached --quiet; then
            echo "native libraries unchanged"
            exit 0
          fi
          git commit -m "Update native libraries"
          git push
